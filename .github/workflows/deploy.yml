name: Deploy staging

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/backend-checks

  deploy:
    name: deploy
    needs: backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: yvddbbztwgwvzabfelpm
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0

      - name: Link staging
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --yes

      - name: Push migrations
        run: supabase db push --yes

      - name: Deploy Edge Functions
        run: |
          mapfile -t entrypoints < <(find supabase/functions -mindepth 2 -name index.ts -not -path '*/_shared/*' | sort)
          if [ "${#entrypoints[@]}" -eq 0 ]; then
            echo "No Edge Function entrypoints; skipping deploy."
            exit 0
          fi
          supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF" --use-api
