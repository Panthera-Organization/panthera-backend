name: Deploy staging

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  scope:
    name: scope
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.scope.outputs.run }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect database and function changes
        id: scope
        run: |
          before="${{ github.event.before }}"
          if [ "$before" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$before" "${{ github.sha }}")
          printf '%s\n' "$files"
          if printf '%s\n' "$files" | bash .github/stack-changes.sh; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  backend:
    name: backend
    needs: scope
    if: needs.scope.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/backend-checks

  deploy:
    name: deploy
    needs: [scope, backend]
    if: needs.scope.outputs.run == 'true' && needs.backend.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v3
        with:
          version: 2.120.0

      - name: Link staging
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --yes

      # Staging can pause after a week of inactivity. Restore the project
      # in the Supabase dashboard, then re-run this workflow.
      - name: Push migrations
        run: supabase db push --yes

      - name: Deploy Edge Functions
        run: |
          mapfile -t entrypoints < <(find supabase/functions -mindepth 2 -name index.ts -not -path '*/_shared/*' | sort)
          if [ "${#entrypoints[@]}" -eq 0 ]; then
            echo "No Edge Function entrypoints; skipping deploy."
            exit 0
          fi
          supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF" --use-api
