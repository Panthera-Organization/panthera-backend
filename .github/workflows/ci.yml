name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect database and function changes
        id: scope
        run: |
          files=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")
          printf '%s\n' "$files"
          if printf '%s\n' "$files" | bash .github/stack-changes.sh; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run database checks
        if: steps.scope.outputs.run == 'true'
        uses: ./.github/actions/backend-checks

  schema:
    name: schema
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Diff schema.graphql against the base branch
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          schema=supabase/functions/_shared/graphql/schema.graphql
          git fetch origin "${{ github.base_ref }}"
          old="${RUNNER_TEMP}/schema.old.graphql"
          git show "${BASE_SHA}:${schema}" > "$old"
          bash .github/schema-diff.sh "$old" "$schema"
